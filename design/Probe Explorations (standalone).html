  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ded,sans-serif;font-weight:700;font-size:24px\">Математика<\u002Fdiv>\n        <div style=\"font-size:14.5px;color:rgba(245,243,236,.55)\">Функции и графики · Пределы · Производные<\u002Fdiv>\n      <\u002Fdiv>\n      <svg width=\"120\" height=\"50\" viewBox=\"0 0 120 50\"><path d=\"M4 28 Q18 2 32 28 T60 28 T88 28 T116 28\" fill=\"none\" stroke=\"#FF7A66\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-dasharray=\"9 7\" style=\"animation:pDash 3s linear infinite\"><\u002Fpath><\u002Fsvg>\n    <\u002Fa>\n    <a href=\"#1c\" style=\"display:grid;grid-template-columns:120px 1fr auto;align-items:center;gap:28px;padding:34px 60px;border-bottom:1px solid rgba(255,255,255,.08);color:#F5F3EC\" style-hover=\"background:rgba(79,193,206,.08);color:#F5F3EC\">\n      <div style=\"font-family:Unbounded,sans-serif;font-weight:800;font-size:38px;color:#4FC1CE\">02<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <div style=\"font-family:Unbounded,sans-serif;font-weight:700;font-size:24px\">Геометрия<\u002Fdiv>\n        <div style=\"font-size:14.5px;color:rgba(245,243,236,.55)\">Треугольники · Окружности · Преобразования<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:12px\">\n        <div style=\"width:34px;height:34px;border:3.5px solid #4FC1CE;border-radius:50%\"><\u002Fdiv>\n        <div style=\"width:30px;height:30px;background:#4FC1CE;animation:pSpin 14s linear infinite\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fa>\n    <a href=\"#1b\" style=\"display:grid;grid-template-columns:120px 1fr auto;align-items:center;gap:28px;padding:34px 60px;border-bottom:1px solid rgba(255,255,255,.08);color:#F5F3EC\" style-hover=\"background:rgba(255,201,77,.08);color:#F5F3EC\">\n      <div style=\"font-family:Unbounded,sans-serif;font-weight:800;font-size:38px;color:#FFC94D\">03<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <div style=\"font-family:Unbounded,sans-serif;font-weight:700;font-size:24px\">Физика<\u002Fdiv>\n        <div style=\"font-size:14.5px;color:rgba(245,243,236,.55)\">Кинематика · Силы · Волны<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:120px;height:50px;position:relative\">\n        <div style=\"position:absolute;bottom:4px;left:0;right:0;height:2px;background:rgba(255,255,255,.2)\"><\u002Fdiv>\n        <div style=\"position:absolute;bottom:7px;right:40px;width:22px;height:22px;border-radius:50%;background:#FFC94D;animation:pBounce 1.4s ease-in-out infinite\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fa>\n    <a href=\"#1b\" style=\"display:grid;grid-template-columns:120px 1fr auto;align-items:center;gap:28px;padding:34px 60px;color:#F5F3EC\" style-hover=\"background:rgba(168,139,224,.08);color:#F5F3EC\">\n      <div style=\"font-family:Unbounded,sans-serif;font-weight:800;font-size:38px;color:#A88BE0\">04<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <div style=\"font-family:Unbounded,sans-serif;font-weight:700;font-size:24px\">Искусственный интеллект<\u002Fdiv>\n        <div style=\"font-size:14.5px;color:rgba(245,243,236,.55)\">Нейронные сети · Обучение · Данные<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(3,12px);gap:6px\">\n        <div style=\"width:12px;height:12px;border-radius:50%;background:#A88BE0;animation:pPulse 2.2s ease-in-out infinite\"><\u002Fdiv>\n        <div style=\"width:12px;height:12px;border-radius:50%;background:#A88BE0;animation:pPulse 2.2s ease-in-out infinite .4s\"><\u002Fdiv>\n        <div style=\"width:12px;height:12px;border-radius:50%;background:#A88BE0;animation:pPulse 2.2s ease-in-out infinite .8s\"><\u002Fdiv>\n        <div style=\"width:12px;height:12px;border-radius:50%;background:#A88BE0;animation:pPulse 2.2s ease-in-out infinite 1.2s\"><\u002Fdiv>\n        <div style=\"width:12px;height:12px;border-radius:50%;background:#A88BE0;animation:pPulse 2.2s ease-in-out infinite 1.6s\"><\u002Fdiv>\n        <div style=\"width:12px;height:12px;border-radius:50%;background:#A88BE0;animation:pPulse 2.2s ease-in-out infinite 2s\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fa>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;align-items:center;justify-content:space-between;padding:24px 44px;border-top:1px solid rgba(255,255,255,.1)\">\n    <div style=\"font-family:Unbounded,sans-serif;font-weight:700;font-size:15px;color:#F5F3EC\">Probe<\u002Fdiv>\n    <div style=\"font-size:13px;color:rgba(245,243,236,.5)\">Учись на русском и кыргызском · бесплатно<\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============ 1c: Geometry chapter (style of 1a) with live demo ============ -->\n<div class=\"dv-opt\" id=\"1c\">\n<div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#1c\">1c<\u002Fa>Глава «Геометрия» в стиле <a class=\"dv-oid\" href=\"#1a\">1a<\u002Fa> — живое демо: тяните вершины треугольника<\u002Fdiv>\n<div class=\"dv-card\" style=\"width:1180px;background:#FFFDF8\">\n\n  <div style=\"display:flex;align-items:center;justify-content:space-between;padding:20px 44px;border-bottom:1px solid rgba(30,25,20,.08)\">\n    <div style=\"display:flex;align-items:center;gap:24px\">\n      <div style=\"display:flex;align-items:center;gap:10px\">\n        <div style=\"width:14px;height:14px;border-radius:50%;background:#E05C4A\"><\u002Fdiv>\n        <div style=\"font-family:Unbounded,sans-serif;font-weight:800;font-size:18px;color:#241F1A\">Probe<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:14px;color:#8A8175;display:flex;gap:8px;align-items:center\">\n        <a href=\"#1a\" style=\"color:#8A8175\" style-hover=\"color:#E05C4A\">Главы<\u002Fa>\n        <span>→<\u002Fspan>\n        <span style=\"color:#2A7F8C;font-weight:600\">02 Геометрия<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:4px;background:#F3EDE2;border-radius:999px;padding:4px\">\n      <div style=\"padding:4px 12px;border-radius:999px;background:#241F1A;color:#FFFDF8;font-size:12.5px;font-weight:600\">РУ<\u002Fdiv>\n      <div style=\"padding:4px 12px;border-radius:999px;color:#241F1A;font-size:12.5px;font-weight:600;cursor:pointer\" style-hover=\"background:rgba(36,31,26,.08)\">КЫ<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#2A7F8C;padding:52px 60px;display:flex;align-items:flex-end;justify-content:space-between;gap:40px\">\n    <div style=\"display:flex;flex-direction:column;gap:12px;max-width:640px\">\n      <div style=\"font-family:ui-monospace,Menlo,monospace;font-size:13px;letter-spacing:2px;color:rgba(255,253,248,.75);font-weight:600\">ГЛАВА 02<\u002Fdiv>\n      <h1 style=\"margin:0;font-family:Unbounded,sans-serif;font-weight:800;font-size:44px;color:#FFFDF8\">Геометрия<\u002Fh1>\n      <p style=\"margin:0;font-size:17px;line-height:1.5;color:rgba(255,253,248,.85);text-wrap:pretty\">Фигуры, углы и преобразования — в моделях, которые реагируют на каждое ваше движение.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:14px;padding-bottom:6px\">\n      <div style=\"width:54px;height:54px;border:6px solid rgba(255,253,248,.9);border-radius:50%;animation:pFloat 7s ease-in-out infinite\"><\u002Fdiv>\n      <div style=\"width:48px;height:48px;background:#F2B134;clip-path:polygon(50% 0,100% 100%,0 100%);animation:pFloat2 8s ease-in-out infinite\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:280px 1fr;gap:0\">\n\n    <div style=\"border-right:1px solid rgba(30,25,20,.08);padding:36px 28px;display:flex;flex-direction:column;gap:6px\">\n      <div style=\"font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:1.5px;color:#8A8175;text-transform:uppercase;margin-bottom:10px\">Разделы<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:4px\">\n        <div style=\"display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:14px;background:#E7F1F2;border:1px solid rgba(42,127,140,.25)\">\n          <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13px;font-weight:600;color:#2A7F8C\">2.1<\u002Fspan>\n          <span style=\"font-size:15px;font-weight:600;color:#241F1A\">Треугольники<\u002Fspan>\n        <\u002Fdiv>\n        <a href=\"#1c\" style=\"display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:14px;color:#5A5248\" style-hover=\"background:rgba(36,31,26,.05);color:#241F1A\">\n          <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13px;font-weight:600;color:#8A8175\">2.2<\u002Fspan>\n          <span style=\"font-size:15px;font-weight:500\">Окружности<\u002Fspan>\n        <\u002Fa>\n        <a href=\"#1c\" style=\"display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:14px;color:#5A5248\" style-hover=\"background:rgba(36,31,26,.05);color:#241F1A\">\n          <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13px;font-weight:600;color:#8A8175\">2.3<\u002Fspan>\n          <span style=\"font-size:15px;font-weight:500\">Преобразования<\u002Fspan>\n        <\u002Fa>\n      <\u002Fdiv>\n      <div style=\"margin-top:auto;padding-top:30px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.6;color:#B0A79A\">программа уточняется — разделы будут добавлены из вашего силлабуса<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"padding:36px 44px 48px;display:flex;flex-direction:column;gap:28px\">\n\n      <div style=\"display:flex;flex-direction:column;gap:6px\">\n        <h2 style=\"margin:0;font-family:Unbounded,sans-serif;font-weight:700;font-size:26px;color:#241F1A\">Сумма углов треугольника<\u002Fh2>\n        <p style=\"margin:0;font-size:16px;line-height:1.55;color:#5A5248;max-width:560px;text-wrap:pretty\">Перетащите любую вершину. Углы меняются — но их сумма всегда равна 180°.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid rgba(36,31,26,.1);border-radius:22px;overflow:hidden\">\n        <svg viewBox=\"0 0 560 380\" width=\"100%\" style=\"display:block;touch-action:none;cursor:default\" onpointermove=\"{{ onMove }}\" onpointerup=\"{{ onUp }}\" onpointerleave=\"{{ onUp }}\" dc-ref=\"{{ svgRef }}\">\n          <sc-if value=\"{{ grid }}\" hint-placeholder-val=\"{{ true }}\">\n            <g>\n              <defs>\n                <pattern id=\"pGrid\" width=\"28\" height=\"28\" patternUnits=\"userSpaceOnUse\">\n                  <circle cx=\"2\" cy=\"2\" r=\"1.4\" fill=\"rgba(36,31,26,.12)\"><\u002Fcircle>\n                <\u002Fpattern>\n              <\u002Fdefs>\n              <rect x=\"0\" y=\"0\" width=\"560\" height=\"380\" fill=\"url(#pGrid)\"><\u002Frect>\n            <\u002Fg>\n          <\u002Fsc-if>\n          <polygon points=\"{{ pts }}\" fill=\"rgba(42,127,140,.14)\" stroke=\"#2A7F8C\" stroke-width=\"3\" stroke-linejoin=\"round\"><\u002Fpolygon>\n          <sc-if value=\"{{ arcs }}\" hint-placeholder-val=\"{{ true }}\">\n            <g>\n              <circle cx=\"{{ ax }}\" cy=\"{{ ay }}\" r=\"26\" fill=\"rgba(224,92,74,.18)\"><\u002Fcircle>\n              <circle cx=\"{{ bx }}\" cy=\"{{ by }}\" r=\"26\" fill=\"rgba(242,177,52,.22)\"><\u002Fcircle>\n              <circle cx=\"{{ cx }}\" cy=\"{{ cy }}\" r=\"26\" fill=\"rgba(123,94,167,.18)\"><\u002Fcircle>\n            <\u002Fg>\n          <\u002Fsc-if>\n          <circle cx=\"{{ ax }}\" cy=\"{{ ay }}\" r=\"11\" fill=\"#E05C4A\" stroke=\"#FFFDF8\" stroke-width=\"3\" style=\"cursor:grab\" onpointerdown=\"{{ dragA }}\"><\u002Fcircle>\n          <circle cx=\"{{ bx }}\" cy=\"{{ by }}\" r=\"11\" fill=\"#F2B134\" stroke=\"#FFFDF8\" stroke-width=\"3\" style=\"cursor:grab\" onpointerdown=\"{{ dragB }}\"><\u002Fcircle>\n          <circle cx=\"{{ cx }}\" cy=\"{{ cy }}\" r=\"11\" fill=\"#7B5EA7\" stroke=\"#FFFDF8\" stroke-width=\"3\" style=\"cursor:grab\" onpointerdown=\"{{ dragC }}\"><\u002Fcircle>\n          <text x=\"{{ lax }}\" y=\"{{ lay }}\" font-family=\"Rubik,sans-serif\" font-size=\"17\" font-weight=\"600\" fill=\"#E05C4A\" text-anchor=\"middle\">{{ angA }}<\u002Ftext>\n          <text x=\"{{ lbx }}\" y=\"{{ lby }}\" font-family=\"Rubik,sans-serif\" font-size=\"17\" font-weight=\"600\" fill=\"#D99A1E\" text-anchor=\"middle\">{{ angB }}<\u002Ftext>\n          <text x=\"{{ lcx }}\" y=\"{{ lcy }}\" font-family=\"Rubik,sans-serif\" font-size=\"17\" font-weight=\"600\" fill=\"#7B5EA7\" text-anchor=\"middle\">{{ angC }}<\u002Ftext>\n        <\u002Fsvg>\n        <div style=\"display:flex;align-items:center;gap:26px;padding:18px 26px;border-top:1px solid rgba(36,31,26,.08);background:#FBF8F1\">\n          <div style=\"display:flex;align-items:baseline;gap:8px\"><span style=\"width:11px;height:11px;border-radius:50%;background:#E05C4A;display:inline-block\"><\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;font-size:16px;font-weight:600;color:#241F1A\">∠A = {{ angA }}<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:baseline;gap:8px\"><span style=\"width:11px;height:11px;border-radius:50%;background:#F2B134;display:inline-block\"><\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;font-size:16px;font-weight:600;color:#241F1A\">∠B = {{ angB }}<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:baseline;gap:8px\"><span style=\"width:11px;height:11px;border-radius:50%;background:#7B5EA7;display:inline-block\"><\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;font-size:16px;font-weight:600;color:#241F1A\">∠C = {{ angC }}<\u002Fspan><\u002Fdiv>\n          <div style=\"margin-left:auto;font-family:ui-monospace,Menlo,monospace;font-size:16px;font-weight:700;color:#2A7F8C\">Σ = 180°<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px\">\n        <div style=\"height:150px;border-radius:18px;border:1px dashed rgba(36,31,26,.25);background:repeating-linear-gradient(45deg,#FBF8F1,#FBF8F1 10px,#F3EDE2 10px,#F3EDE2 20px);display:flex;align-items:center;justify-content:center\">\n          <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13px;color:#8A8175\">демо: окружности — появится позже<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"height:150px;border-radius:18px;border:1px dashed rgba(36,31,26,.25);background:repeating-linear-gradient(45deg,#FBF8F1,#FBF8F1 10px,#F3EDE2 10px,#F3EDE2 20px);display:flex;align-items:center;justify-content:center\">\n          <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13px;color:#8A8175\">демо: преобразования — появится позже<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<p class=\"dv-next\">Дальше: «сделай главу в стиле <a class=\"dv-oid\" href=\"#1b\">1b<\u002Fa>» · «больше демо в <a class=\"dv-oid\" href=\"#1c\">1c<\u002Fa>» · «смешай хиро из <a class=\"dv-oid\" href=\"#1b\">1b<\u002Fa> с карточками из <a class=\"dv-oid\" href=\"#1a\">1a<\u002Fa>»<\u002Fp>\n<\u002Fsection>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showArcs&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Демо «Треугольник»&quot;},&quot;showGrid&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Демо «Треугольник»&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    tri: [ {x:140,y:305}, {x:435,y:290}, {x:305,y:85} ],\n    drag: -1\n  };\n  svgRef = React.createRef();\n\n  toSvg(e) {\n    const svg = this.svgRef.current;\n    if (!svg) return null;\n    const r = svg.getBoundingClientRect();\n    const x = (e.clientX - r.left) * 560 / r.width;\n    const y = (e.clientY - r.top) * 380 / r.height;\n    return {\n      x: Math.min(535, Math.max(25, x)),\n      y: Math.min(355, Math.max(25, y))\n    };\n  }\n\n  startDrag(i) {\n    return (e) => {\n      e.preventDefault();\n      this.setState({ drag: i });\n    };\n  }\n\n  renderVals() {\n    const t = this.state.tri;\n    const angle = (p, q, r) => {\n      const v1 = { x: q.x - p.x, y: q.y - p.y };\n      const v2 = { x: r.x - p.x, y: r.y - p.y };\n      const denom = Math.hypot(v1.x, v1.y) * Math.hypot(v2.x, v2.y);\n      if (denom < 1e-6) return 0;\n      const cos = Math.max(-1, Math.min(1, (v1.x * v2.x + v1.y * v2.y) / denom));\n      return Math.acos(cos) * 180 / Math.PI;\n    };\n    const rawA = angle(t[0], t[1], t[2]);\n    const rawB = angle(t[1], t[0], t[2]);\n    const A = Math.round(rawA);\n    const B = Math.round(rawB);\n    const C = 180 - A - B;\n\n    const cx0 = (t[0].x + t[1].x + t[2].x) / 3;\n    const cy0 = (t[0].y + t[1].y + t[2].y) / 3;\n    const label = (p) => {\n      const dx = p.x - cx0, dy = p.y - cy0;\n      const len = Math.hypot(dx, dy) || 1;\n      return {\n        x: Math.min(540, Math.max(20, p.x + dx / len * 34)),\n        y: Math.min(368, Math.max(18, p.y + dy / len * 34 + 6))\n      };\n    };\n    const la = label(t[0]), lb = label(t[1]), lc = label(t[2]);\n\n    const onMove = (e) => {\n      if (this.state.drag < 0) return;\n      const p = this.toSvg(e);\n      if (!p) return;\n      const tri = this.state.tri.slice();\n      tri[this.state.drag] = p;\n      this.setState({ tri });\n    };\n    const onUp = () => { if (this.state.drag >= 0) this.setState({ drag: -1 }); };\n\n    return {\n      svgRef: this.svgRef,\n      pts: t.map(p => p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' '),\n      ax: t[0].x, ay: t[0].y,\n      bx: t[1].x, by: t[1].y,\n      cx: t[2].x, cy: t[2].y,\n      lax: la.x, lay: la.y,\n      lbx: lb.x, lby: lb.y,\n      lcx: lc.x, lcy: lc.y,\n      angA: A + '°', angB: B + '°', angC: C + '°',\n      dragA: this.startDrag(0),\n      dragB: this.startDrag(1),\n      dragC: this.startDrag(2),\n      onMove, onUp,\n      arcs: this.props.showArcs ?? true,\n      grid: this.props.showGrid ?? true\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
